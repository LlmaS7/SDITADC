<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SDITADC · v0.2.1 · 仓库运行</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body class="main-page">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">S</span><div><h1>三机仓库协作</h1><p>SDITADC · 仓库运行总览</p></div></div>
    <div class="header-stats"><span id="connection" class="badge">正在连接</span><span>已完成 <strong id="overview-completed">0</strong></span><span>执行中 <strong id="overview-running">0</strong></span><span>待处理 <strong id="overview-pending">0</strong></span></div>
  </header>
  <nav class="toolbar" aria-label="仿真控制">
    <button id="pause" class="primary" disabled>暂停</button>
    <label class="speed-label">速度 <select id="speed" aria-label="仿真速度"><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option><option value="8">8×</option></select></label>
    <span class="toolbar-spacer"></span>
    <button id="debug-window">调试窗口 ↗</button>
  </nav>
  <main class="workspace">
    <section class="visuals" aria-label="同步仓库预览">
      <article class="panel scene-panel">
        <div class="panel-title"><div><span class="eyebrow">空间视图</span><h2>3D 仓库预览</h2></div><div class="panel-tools"><span class="hint">拖动旋转 · 滚轮缩放</span><button id="recenter" class="small">恢复视角</button></div></div>
        <div id="scene3d" class="scene"><div id="scene-error" class="scene-message" hidden></div><div class="scene-legend"><i class="dot blue"></i> R1 <i class="dot orange"></i> R2 <i class="dot green"></i> R3 <span>货架 · 作业点 · 路线</span></div></div>
      </article>
      <article class="panel map-panel">
        <div class="panel-title"><div><span class="eyebrow">俯视视图</span><h2>2D 路径预览</h2></div><span class="hint">机器人当前位置与行进路线</span></div>
        <div class="map-body"><div class="map-canvas-wrap"><canvas id="map2d" aria-label="仓库二维地图"></canvas></div><aside class="robot-strip"><div class="legend-text"><span>取货点</span><span>配送点</span><span>停车位</span></div><div id="robots"></div><p class="subtle map-tip">点击右侧任务，查看其取送位置。机器人上方的小货箱表示已载货。</p></aside></div>
      </article>
    </section>
    <aside class="panel task-panel" aria-label="任务中心">
      <div class="panel-title"><div><span class="eyebrow">任务调度</span><h2>任务中心 <span id="task-count" class="count">0</span></h2></div><span id="completed-count" class="subtle">完成 0</span></div>
      <div class="task-filters" role="group" aria-label="任务筛选"><button data-filter="all" class="active">全部</button><button data-filter="active">未完成</button><button data-filter="completed">已完成</button></div>
      <div id="tasks" class="task-list"><p class="empty">正在载入普通仓库场景…</p></div>
      <section class="task-detail" aria-label="选中任务详情"><div class="detail-heading"><h3 id="detail-title">选择一个任务</h3><button id="clear-selection" class="text-button" title="清除位置高亮">清除高亮</button></div><p id="detail-route">点击任务查看其取送位置</p><p id="detail-note" class="subtle"></p><div class="task-actions"><button id="raise" disabled>提升一级</button><button id="urgent" class="danger" disabled>设为紧急</button><button id="cancel" disabled>取消任务</button></div></section>
    </aside>
  </main>
  <footer class="statusbar"><span id="status-message">正在初始化仓库…</span><span>三台机器人 · 单件搬运</span></footer>
  <script type="module" src="./app.js"></script>
</body>
</html>
